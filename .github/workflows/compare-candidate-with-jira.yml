name: Compare Candidate With Jira

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Fix Version Jira. Ex: release-2026.10"
        required: true
      candidate_branch:
        description: "Branch candidate. Ex: candidate-2026.10"
        required: true
      base_branch:
        description: "Branch base. Ex: develop"
        required: true
        default: "develop"

permissions:
  contents: read

jobs:
  compare-candidate-with-jira:
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Parameters
        run: |
          echo "Release Jira     : ${{ github.event.inputs.release_name }}"
          echo "Candidate Branch : ${{ github.event.inputs.candidate_branch }}"
          echo "Base Branch      : ${{ github.event.inputs.base_branch }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare candidate commits with Jira Fix Version
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          RELEASE_NAME: ${{ github.event.inputs.release_name }}
          CANDIDATE_BRANCH: ${{ github.event.inputs.candidate_branch }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch }}

        run: |
          python .github/scripts/compare_candidate_with_jira.py

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-candidate-with-jira-report
          path: candidate-jira-comparison-report.json
